<main><article><header><h1>川沿いの図書室と、町に流れる時間</h1><p>Chrome Android の「このページを読み上げ」判定を切り分けるための制御実験です。</p></header><p>川の曲がり角に建つ小さな図書室には、毎朝、町の一日が少しずつ集まってくる。</p>
<p>図書室は、駅前の大通りから一本入った道の先にある。建物の裏には川が流れ、春には土手の草が明るい緑になる。朝の開館時刻より少し早く着くと、玄関のガラスにはまだ夜の冷たさが残り、川面を渡る風の音だけが聞こえる。</p></article></main>
