name: Check root static Read Aloud experiment

on:
  pull_request:
    paths:
      - "index.html"
      - "tests/root-static-native-readaloud-experiment.test.mjs"
      - ".github/workflows/verify-root-static-readaloud.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/root-static-native-readaloud-experiment.test.mjs
